<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1400px; height: 560px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 52px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: linear-gradient(120deg, #17252b 0%, #29464d 100%);
        color: #fff;
      }
      body::before, body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: #7b5cf0;
        opacity: .34;
      }
      body::before { width: 520px; height: 520px; left: -180px; top: -260px; }
      body::after { width: 650px; height: 650px; right: -220px; bottom: -360px; }
      img { z-index: 1; width: 190px; height: 190px; filter: drop-shadow(0 24px 34px rgba(0, 0, 0, .32)); }
      div { z-index: 1; }
      h1 { margin: 0 0 14px; font-size: 62px; line-height: 1; }
      p { margin: 0; color: #cbdadc; font-size: 23px; font-weight: 600; }
    </style>
  </head>
  <body>
    <img src="../../icons/icon128.png" alt="">
    <div><h1>Paper Clipper</h1><p>From arXiv to structured Obsidian notes</p></div>
  </body>
</html>
