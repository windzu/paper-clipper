<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 42px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: linear-gradient(135deg, #17252b 0%, #243c42 100%);
        color: #fff;
      }
      body::after {
        content: "";
        position: absolute;
        right: -55px;
        bottom: -86px;
        width: 230px;
        height: 230px;
        border-radius: 50%;
        background: #7b5cf0;
        opacity: .5;
      }
      img { z-index: 1; width: 116px; height: 116px; filter: drop-shadow(0 12px 22px rgba(0, 0, 0, .28)); }
      div { z-index: 1; }
      h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.05; }
      p { margin: 0; color: #cad8da; font-size: 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <img src="../../icons/icon128.png" alt="">
    <div><h1>Paper<br>Clipper</h1><p>arXiv → Obsidian</p></div>
  </body>
</html>
